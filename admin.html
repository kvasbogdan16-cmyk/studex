<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Адмін-панель — Studex</title>
  <meta name="theme-color" content="#5b3df5">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

  <header class="header admin-header">
    <div class="container header__inner">
      <a href="/" class="logo" aria-label="Studex — на сайт">
        <span class="logo__mark">S</span>
        <span class="logo__text">Studex</span>
        <span class="admin-header__tag">адмін</span>
      </a>
      <div class="admin-header__user" id="user-box" hidden>
        <span class="admin-header__email" id="user-email"></span>
        <button class="btn btn--ghost btn--sm" id="logout">Вийти</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <!-- Завантаження -->
    <div class="container admin-loading" id="view-loading">
      <span class="spinner" aria-hidden="true"></span>
      <span>Завантаження…</span>
    </div>

    <!-- Вхід -->
    <section class="container admin-login" id="view-login" hidden>
      <div class="login-card">
        <span class="eyebrow">Адмін-панель</span>
        <h1 class="login-card__title">Вхід</h1>
        <p class="login-card__text">Розділ лише для команди Studex.</p>

        <form class="apply__form" id="login-form" novalidate>
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="login-password">Пароль</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <p class="apply__error" id="login-error" role="alert"></p>
          <button type="submit" class="btn btn--primary apply__submit" id="login-submit">Увійти</button>
        </form>
      </div>
    </section>

    <!-- Воронка -->
    <section class="container admin-leads" id="view-leads" hidden>
      <div class="admin-leads__head">
        <div>
          <h1 class="admin-leads__title">Воронка</h1>
          <p class="admin-leads__sub" id="leads-summary">Заявки з сайту потрапляють у першу колонку. Перетягни картку або обери етап на ній.</p>
        </div>
        <div class="admin-leads__actions">
          <button class="btn btn--ghost btn--sm" id="refresh" aria-label="Оновити воронку">↻ Оновити</button>
          <button class="btn btn--primary btn--sm" id="add-open">+ Додати клієнта</button>
        </div>
      </div>

      <p class="apply__error" id="leads-error" role="alert"></p>
      <div class="board" id="board" aria-live="polite"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Новий клієнт -->
  <dialog class="add-dialog" id="add-dialog" aria-labelledby="add-title">
    <form class="apply__form" id="add-form" novalidate>
      <div class="add-dialog__head">
        <h2 class="add-dialog__title" id="add-title">Новий клієнт</h2>
        <button type="button" class="add-dialog__close" id="add-close" aria-label="Закрити">×</button>
      </div>
      <div class="field">
        <label for="add-name">Ім'я</label>
        <input id="add-name" name="name" type="text" autocomplete="off" required minlength="2" maxlength="100">
      </div>
      <div class="field">
        <label for="add-phone">Телефон</label>
        <input id="add-phone" name="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="+380 XX XXX XX XX" required maxlength="30">
      </div>
      <div class="field">
        <label for="add-comment">Коментар <span class="field__optional">(необов'язково)</span></label>
        <textarea id="add-comment" name="comment" rows="3" maxlength="1000" placeholder="Звідки дізнався, що шукає"></textarea>
      </div>
      <div class="field">
        <label for="add-stage">Етап</label>
        <select id="add-stage" name="stage" class="add-dialog__select"></select>
      </div>
      <p class="apply__error" id="add-error" role="alert"></p>
      <button type="submit" class="btn btn--primary apply__submit" id="add-submit">Додати у воронку</button>
    </form>
  </dialog>

  <template id="column-template">
    <section class="column">
      <header class="column__head">
        <h2 class="column__title"></h2>
        <span class="column__count">0</span>
      </header>
      <div class="column__list"></div>
      <p class="column__empty">Порожньо</p>
    </section>
  </template>

  <template id="lead-template">
    <article class="lead">
      <div class="lead__top">
        <h3 class="lead__name"></h3>
        <span class="lead__source"></span>
      </div>
      <time class="lead__date"></time>
      <a class="lead__phone"></a>
      <p class="lead__comment"></p>
      <label class="lead__status">
        <span class="visually-hidden">Етап</span>
        <select></select>
      </label>
      <details class="lead__history">
        <summary></summary>
        <ol class="history"></ol>
      </details>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
